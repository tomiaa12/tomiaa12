<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 360" width="1300" height="360" fill="none">
  <style>
    @keyframes sel { 0%,24% { transform: translateY(0) } 25%,49% { transform: translateY(22px) } 50%,74% { transform: translateY(44px) } 75%,100% { transform: translateY(66px) } }
    .sel { animation: sel 4.8s steps(1) infinite; }
    @keyframes type { 0% { transform: scaleX(0) } 70%,100% { transform: scaleX(1) } }
    .ln { transform-box: fill-box; transform-origin: left center; animation: type 4.8s ease-out infinite; }
    .ln2 { animation-delay: .35s } .ln3 { animation-delay: .7s } .ln4 { animation-delay: 1.05s }
    @keyframes pop { 0%,15% { opacity: 0; transform: translateY(8px) } 28%,80% { opacity: 1; transform: translateY(0) } 100% { opacity: 0 } }
    .b1 { animation: pop 4.8s ease infinite; }
    .b2 { animation: pop 4.8s ease infinite; animation-delay: .8s; }
    .b3 { animation: pop 4.8s ease infinite; animation-delay: 1.6s; }
    @keyframes caret { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
    .caret { animation: caret 1.05s steps(1) infinite; }
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1300" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B16"/><stop offset="1" stop-color="#151C3A"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#FFFFFF" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1300" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1300" height="360" rx="28" fill="url(#grid)"/>
  <rect x="1" y="1" width="1298" height="358" rx="27" stroke="#7C8CFF" stroke-opacity="0.45"/>
  <text x="52" y="78" fill="#9AABFF" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" letter-spacing="2.2">01  ·  DESKTOP  ·  RUST</text>
  <text x="52" y="146" fill="#F4F7FF" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="54" font-weight="700">Multara</text>
  <text x="52" y="198" fill="#E6EBF6" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="22">一个窗口，放下所有 AI 编程智能体。</text>
  <text x="52" y="234" fill="#93A0BD" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="16">One window for Claude Code, Codex, and Cursor.</text>
  <g font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14">
    <rect x="52" y="268" width="78" height="32" rx="16" fill="#6D7CFF" fill-opacity="0.16"/>
    <text x="91" y="289" fill="#D5DCFF" text-anchor="middle">Tasks</text>
    <rect x="140" y="268" width="96" height="32" rx="16" fill="#5EEAD4" fill-opacity="0.12"/>
    <text x="188" y="289" fill="#C9F8EF" text-anchor="middle">Monaco</text>
    <rect x="246" y="268" width="64" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.06"/>
    <text x="278" y="289" fill="#D5DDED" text-anchor="middle">Git</text>
  </g>
  <g transform="translate(690,46)">
    <rect width="558" height="268" rx="18" fill="#0A1022" stroke="#7C8CFF" stroke-opacity="0.4"/>
    <rect width="558" height="36" rx="18" fill="#141B36"/>
    <rect y="18" width="558" height="18" fill="#141B36"/>
    <circle cx="20" cy="18" r="4.5" fill="#FF5F57"/>
    <circle cx="36" cy="18" r="4.5" fill="#FEBC2E"/>
    <circle cx="52" cy="18" r="4.5" fill="#28C840"/>
    <text x="279" y="23" fill="#A9B4D0" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12">Multara</text>
    <rect x="14" y="50" width="124" height="204" rx="10" fill="#0E152C"/>
    <rect class="sel" x="22" y="64" width="108" height="18" rx="5" fill="#7C8CFF" fill-opacity="0.28"/>
    <rect x="30" y="70" width="64" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.7"/>
    <rect x="30" y="94" width="78" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.18"/>
    <rect x="30" y="116" width="56" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.18"/>
    <rect x="30" y="138" width="72" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.18"/>
    <rect x="150" y="50" width="246" height="204" rx="10" fill="#090E1C"/>
    <rect class="ln" x="166" y="70" width="120" height="7" rx="3" fill="#7C8CFF"/>
    <rect class="ln ln2" x="166" y="90" width="180" height="7" rx="3" fill="#5EEAD4" fill-opacity="0.8"/>
    <rect class="ln ln3" x="166" y="110" width="96" height="7" rx="3" fill="#FFFFFF" fill-opacity="0.2"/>
    <rect class="ln ln4" x="166" y="130" width="150" height="7" rx="3" fill="#F6C453" fill-opacity="0.85"/>
    <rect class="caret" x="322" y="126" width="2" height="14" fill="#F4F7FF"/>
    <rect x="408" y="50" width="136" height="204" rx="10" fill="#121936"/>
    <g class="b1"><rect x="420" y="70" width="108" height="36" rx="10" fill="#7C8CFF" fill-opacity="0.35"/></g>
    <g class="b2"><rect x="420" y="118" width="96" height="30" rx="10" fill="#FFFFFF" fill-opacity="0.08"/></g>
    <g class="b3"><rect x="420" y="160" width="84" height="30" rx="10" fill="#5EEAD4" fill-opacity="0.28"/></g>
  </g>
</svg>
