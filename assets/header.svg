<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 210" width="1300" height="210" fill="none">
  <style>
    @keyframes draw { 0%,12% { transform: scaleX(0) } 36%,82% { transform: scaleX(1) } 100% { transform: scaleX(0) } }
    .draw { transform-box: fill-box; transform-origin: left center; animation: draw 7s cubic-bezier(.6,0,.2,1) infinite; }
    @keyframes caret { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
    .caret { animation: caret 1.05s steps(1) infinite; }
    @keyframes sweep { 0% { transform: translateX(-80px); opacity: 0 } 18% { opacity: .9 } 70% { opacity: .9 } 100% { transform: translateX(920px); opacity: 0 } }
    .sweep { animation: sweep 6.5s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1300" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B14"/><stop offset="1" stop-color="#141C33"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1080 20) scale(340)">
      <stop stop-color="#6D7CFF" stop-opacity="0.55"/><stop offset="1" stop-color="#6D7CFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#FFFFFF" stroke-opacity="0.045"/>
    </pattern>
  </defs>
  <rect width="1300" height="210" rx="24" fill="url(#bg)"/>
  <rect width="1300" height="210" rx="24" fill="url(#grid)"/>
  <rect width="1300" height="210" rx="24" fill="url(#glow)"/>
  <rect x="1" y="1" width="1298" height="208" rx="23" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <text x="56" y="78" fill="#8EA0C8" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" letter-spacing="3">GITHUB  ·  TOMIAA12</text>
  <text x="56" y="132" fill="#F4F7FF" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="58" font-weight="700">tomiaa</text>
  <rect class="caret" x="248" y="86" width="3" height="42" fill="#8EF0D2"/>
  <rect class="draw" x="56" y="148" width="168" height="3" fill="#6D7CFF"/>
  <rect class="sweep" x="56" y="146" width="90" height="7" fill="#8EF0D2" opacity="0.8"/>
  <text x="56" y="182" fill="#C9D4E8" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="18">把能用的软件做出来，并放在公开的地方。</text>
</svg>
