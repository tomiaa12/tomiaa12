<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 360" width="1300" height="360" fill="none">
  <style>
    @keyframes line { 0% { transform: scaleX(0); opacity: 0 } 30%,85% { transform: scaleX(1); opacity: 1 } 100% { opacity: .4 } }
    .ln { transform-box: fill-box; transform-origin: left center; animation: line 5s ease-out infinite; }
    .ln2 { animation-delay: .25s } .ln3 { animation-delay: .5s } .ln4 { animation-delay: .75s }
    @keyframes caret { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
    .caret { animation: caret 1.05s steps(1) infinite; }
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1300" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071410"/><stop offset="1" stop-color="#12352C"/>
    </linearGradient>
  </defs>
  <rect width="1300" height="360" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1298" height="358" rx="27" stroke="#3EE0B0" stroke-opacity="0.4"/>
  <text x="52" y="78" fill="#8EF0D2" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" letter-spacing="2.2">04  ·  SITE  ·  BLOG</text>
  <text x="52" y="146" fill="#F3FFFB" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="54" font-weight="700">KYX Box</text>
  <text x="52" y="198" fill="#DDF6EE" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="22">技术笔记写在 kuangyx.cn。</text>
  <text x="52" y="234" fill="#8FB8AC" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="16">Notes published at kuangyx.cn.</text>
  <g font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14">
    <rect x="52" y="268" width="118" height="32" rx="16" fill="#3EE0B0" fill-opacity="0.16"/>
    <text x="111" y="289" fill="#D8FFF3" text-anchor="middle">kuangyx.cn</text>
    <rect x="180" y="268" width="78" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.06"/>
    <text x="219" y="289" fill="#DDF6EE" text-anchor="middle">Notes</text>
  </g>
  <g transform="translate(690,46)" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
    <rect width="558" height="268" rx="18" fill="#0C1C18" stroke="#3EE0B0" stroke-opacity="0.35"/>
    <rect width="558" height="40" rx="18" fill="#123028"/>
    <rect y="18" width="558" height="22" fill="#123028"/>
    <circle cx="22" cy="20" r="4.5" fill="#FF5F57"/>
    <circle cx="38" cy="20" r="4.5" fill="#FEBC2E"/>
    <circle cx="54" cy="20" r="4.5" fill="#28C840"/>
    <rect x="186" y="10" width="186" height="22" rx="11" fill="#071410"/>
    <text x="279" y="25" fill="#8EF0D2" text-anchor="middle" font-size="13">kuangyx.cn</text>
    <rect class="ln" x="28" y="68" width="180" height="14" rx="4" fill="#3EE0B0"/>
    <rect class="caret" x="214" y="66" width="2" height="18" fill="#EFFFF8"/>
    <rect class="ln ln2" x="28" y="98" width="360" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.18"/>
    <rect class="ln ln3" x="28" y="118" width="280" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.1"/>
    <rect x="28" y="148" width="502" height="92" rx="12" fill="#3EE0B0" fill-opacity="0.1"/>
    <text x="48" y="186" fill="#EFFFF8" font-size="22">把做过的东西写清楚。</text>
    <text x="48" y="214" fill="#8FB8AC" font-size="14">Write down what actually shipped.</text>
  </g>
</svg>
