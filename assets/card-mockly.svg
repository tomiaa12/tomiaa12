<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 360" width="1300" height="360" fill="none">
  <style>
    @keyframes row { 0%,24% { transform: translateY(0) } 25%,49% { transform: translateY(52px) } 50%,74% { transform: translateY(104px) } 75%,100% { transform: translateY(156px) } }
    .row { animation: row 4.8s steps(1) infinite; }
    @keyframes tag { 0%,20% { opacity: 0 } 28%,88% { opacity: 1 } 100% { opacity: 0 } }
    .tag { animation: tag 4.8s steps(1) infinite; }
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1300" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0C0A14"/><stop offset="1" stop-color="#241838"/>
    </linearGradient>
  </defs>
  <rect width="1300" height="360" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1298" height="358" rx="27" stroke="#C084FC" stroke-opacity="0.45"/>
  <text x="52" y="78" fill="#D7B6FF" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" letter-spacing="2.2">03  ·  CHROME  ·  DEVTOOLS</text>
  <text x="52" y="146" fill="#F7F2FF" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="54" font-weight="700">Mockly</text>
  <text x="52" y="198" fill="#E8DCF8" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="22">在 DevTools 里拦截并改写网络请求。</text>
  <text x="52" y="234" fill="#A894C4" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="16">Intercept and rewrite network requests in Chrome DevTools.</text>
  <g font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14">
    <rect x="52" y="268" width="78" height="32" rx="16" fill="#C084FC" fill-opacity="0.18"/>
    <text x="91" y="289" fill="#F0E2FF" text-anchor="middle">Mock</text>
    <rect x="140" y="268" width="102" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.06"/>
    <text x="191" y="289" fill="#E8DCF8" text-anchor="middle">Network</text>
  </g>
  <g transform="translate(690,46)" font-family="Segoe UI, sans-serif">
    <rect width="558" height="268" rx="18" fill="#120E1C" stroke="#C084FC" stroke-opacity="0.4"/>
    <text x="20" y="32" fill="#D7B6FF" font-size="14">Network</text>
    <text x="108" y="32" fill="#8E7CAA" font-size="14">Mock</text>
    <rect class="tag" x="456" y="14" width="78" height="22" rx="11" fill="#C084FC"/>
    <text class="tag" x="495" y="29" fill="#1A1028" text-anchor="middle" font-size="12" font-weight="700">MOCK</text>
    <rect class="row" x="16" y="52" width="526" height="44" rx="8" fill="#C084FC" fill-opacity="0.22" stroke="#C084FC" stroke-opacity="0.7"/>
    <text x="32" y="79" fill="#8E7CAA" font-size="14">GET</text>
    <text x="84" y="79" fill="#FFFFFF" font-size="14">/api/profile</text>
    <text x="470" y="79" fill="#C9B6E4" font-size="14">200</text>
    <text x="32" y="131" fill="#8E7CAA" font-size="14">GET</text>
    <text x="84" y="131" fill="#FFFFFF" font-size="14">/api/orders</text>
    <text x="470" y="131" fill="#C9B6E4" font-size="14">200</text>
    <text x="32" y="183" fill="#8E7CAA" font-size="14">POST</text>
    <text x="90" y="183" fill="#FFFFFF" font-size="14">/api/checkout</text>
    <text x="470" y="183" fill="#C9B6E4" font-size="14">201</text>
    <text x="32" y="235" fill="#8E7CAA" font-size="14">GET</text>
    <text x="84" y="235" fill="#FFFFFF" font-size="14">/api/config</text>
    <text x="470" y="235" fill="#C9B6E4" font-size="14">304</text>
  </g>
</svg>
