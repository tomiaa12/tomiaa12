<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0C0A14"/>
      <stop offset="1" stop-color="#241838"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1040 20) scale(380)">
      <stop stop-color="#C084FC" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#C084FC" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#FFFFFF" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="28" fill="url(#grid)"/>
  <rect width="1280" height="360" rx="28" fill="url(#glow)"/>
  <rect x="1" y="1" width="1278" height="358" rx="27" stroke="#C084FC" stroke-opacity="0.45"/>
  <text x="56" y="78" fill="#D7B6FF" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" letter-spacing="2.4">03  ·  CHROME  ·  DEVTOOLS</text>
  <text x="56" y="148" fill="#F7F2FF" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="56" font-weight="700">Mockly</text>
  <text x="56" y="204" fill="#E8DCF8" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="24">在 DevTools 里拦截并改写网络请求。</text>
  <text x="56" y="242" fill="#A894C4" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="18">A Chrome DevTools extension for network mocking.</text>
  <g font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14">
    <rect x="56" y="274" width="78" height="32" rx="16" fill="#C084FC" fill-opacity="0.18"/>
    <text x="95" y="295" fill="#F0E2FF" text-anchor="middle">Mock</text>
    <rect x="144" y="274" width="102" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.06"/>
    <text x="195" y="295" fill="#E8DCF8" text-anchor="middle">Network</text>
  </g>
  <g transform="translate(700,48)" font-family="Segoe UI, sans-serif">
    <rect width="524" height="264" rx="18" fill="#120E1C" stroke="#C084FC" stroke-opacity="0.4"/>
    <rect width="524" height="42" rx="18" fill="#1C1530"/>
    <rect y="20" width="524" height="22" fill="#1C1530"/>
    <text x="20" y="27" fill="#D7B6FF" font-size="14">Network</text>
    <text x="108" y="27" fill="#8E7CAA" font-size="14">Mock</text>
    <rect x="430" y="10" width="74" height="22" rx="11" fill="#C084FC"/>
    <text x="467" y="25" fill="#1A1028" text-anchor="middle" font-size="12" font-weight="700">MOCK</text>
    <rect x="16" y="58" width="492" height="36" rx="8" fill="#FFFFFF" fill-opacity="0.04"/>
    <text x="32" y="81" fill="#8E7CAA" font-size="13">GET</text>
    <text x="78" y="81" fill="#D9CCEE" font-size="13">/api/profile</text>
    <text x="430" y="81" fill="#8E7CAA" font-size="13">200</text>
    <rect x="16" y="102" width="492" height="44" rx="8" fill="#C084FC" fill-opacity="0.18" stroke="#C084FC" stroke-opacity="0.65"/>
    <text x="32" y="129" fill="#E9D5FF" font-size="14" font-weight="700">GET</text>
    <text x="78" y="129" fill="#FFFFFF" font-size="14">/api/orders</text>
    <text x="360" y="129" fill="#E9D5FF" font-size="13">mocked</text>
    <text x="436" y="129" fill="#F5D0FE" font-size="14" font-weight="700">200</text>
    <rect x="16" y="154" width="492" height="36" rx="8" fill="#FFFFFF" fill-opacity="0.04"/>
    <text x="32" y="177" fill="#8E7CAA" font-size="13">POST</text>
    <text x="84" y="177" fill="#D9CCEE" font-size="13">/api/checkout</text>
    <text x="430" y="177" fill="#8E7CAA" font-size="13">201</text>
    <rect x="16" y="198" width="492" height="36" rx="8" fill="#FFFFFF" fill-opacity="0.04"/>
    <text x="32" y="221" fill="#8E7CAA" font-size="13">GET</text>
    <text x="78" y="221" fill="#D9CCEE" font-size="13">/api/config</text>
    <text x="430" y="221" fill="#8E7CAA" font-size="13">304</text>
  </g>
