<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 360" width="1300" height="360" fill="none">
  <style>
    @keyframes walk { 0% { transform: translate(0,0) } 25% { transform: translate(36px,-8px) } 50% { transform: translate(72px,0) } 75% { transform: translate(108px,-8px) } 100% { transform: translate(144px,0) } }
    .walker { animation: walk 2.4s linear infinite; }
    @keyframes sun { 0%,100% { opacity: .65 } 50% { opacity: 1 } }
    .sun { animation: sun 2.4s ease-in-out infinite; }
    @keyframes scan { 0% { transform: translateY(0) } 100% { transform: translateY(180px) } }
    .scan { animation: scan 2.8s linear infinite; }
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1300" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14080B"/><stop offset="1" stop-color="#3A141C"/>
    </linearGradient>
    <clipPath id="screen"><rect x="736" y="78" width="300" height="188"/></clipPath>
  </defs>
  <rect width="1300" height="360" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1298" height="358" rx="27" stroke="#FF5A6A" stroke-opacity="0.42"/>
  <text x="52" y="78" fill="#FF8B96" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" letter-spacing="2.2">01  ·  ARCHIVE  ·  NES</text>
  <text x="52" y="146" fill="#FFF5F6" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="54" font-weight="700">nesRoms</text>
  <text x="52" y="198" fill="#F8DDE1" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="22">400+ 全中文红白机游戏 ROM。</text>
  <text x="52" y="234" fill="#C9A0A8" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="16">A Chinese-language archive of NES games.</text>
  <g font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14">
    <rect x="52" y="268" width="64" height="32" rx="16" fill="#FF5A6A" fill-opacity="0.18"/>
    <text x="84" y="289" fill="#FFD5DA" text-anchor="middle">FC</text>
    <rect x="126" y="268" width="92" height="32" rx="16" fill="#F6C453" fill-opacity="0.14"/>
    <text x="172" y="289" fill="#FFE7B0" text-anchor="middle">400+</text>
  </g>
  <g>
    <rect x="714" y="56" width="344" height="248" rx="16" fill="#1A0C10" stroke="#FF5A6A" stroke-opacity="0.35"/>
    <g clip-path="url(#screen)">
      <rect x="736" y="78" width="300" height="112" fill="#16325C"/>
      <rect class="sun" x="960" y="96" width="28" height="28" fill="#F6C453"/>
      <rect x="736" y="190" width="300" height="18" fill="#2F6B3A"/>
      <rect x="736" y="208" width="300" height="18" fill="#3E8A48"/>
      <rect x="736" y="226" width="300" height="40" fill="#6B4423"/>
      <g class="walker">
        <rect x="760" y="168" width="14" height="22" fill="#F4F7FF"/>
        <rect x="774" y="176" width="14" height="16" fill="#FF5A6A"/>
        <rect x="788" y="160" width="10" height="30" fill="#F6C453"/>
      </g>
      <rect class="scan" x="736" y="78" width="300" height="10" fill="#FFFFFF" fill-opacity="0.08"/>
    </g>
    <rect x="1076" y="96" width="78" height="168" rx="8" fill="#C4374A"/>
    <rect x="1088" y="112" width="54" height="70" rx="4" fill="#F4E4C4"/>
    <rect x="1096" y="196" width="38" height="8" rx="2" fill="#F4E4C4" fill-opacity="0.7"/>
    <rect x="1096" y="212" width="28" height="8" rx="2" fill="#F4E4C4" fill-opacity="0.45"/>
    <rect x="1088" y="236" width="54" height="10" rx="2" fill="#7A1E2C"/>
  </g>
</svg>
